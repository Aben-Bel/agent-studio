server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> backend container. The trailing slash on proxy_pass strips the
    # /api/ prefix, matching the Vite dev proxy:
    #   /api/capabilities  ->  http://backend:8000/capabilities
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /run streams Server-Sent Events. Disable buffering so chunks reach
        # the browser as they are produced instead of being held back.
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 3600s;
    }
}
