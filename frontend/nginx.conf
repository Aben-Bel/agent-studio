server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable - cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: fall back to index.html for client-side routes.
    # index.html must NOT be cached, or browsers keep serving an old bundle
    # after a deploy ("works for me, broken for you").
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # API -> backend container. The trailing slash on proxy_pass strips the
    # /api/ prefix, matching the Vite dev proxy:
    #   /api/capabilities  ->  http://backend:8000/capabilities
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /run streams Server-Sent Events. Disable buffering so chunks reach
        # the browser as they are produced instead of being held back.
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 3600s;
    }
}
